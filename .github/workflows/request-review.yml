name: Request review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: Open PR number
        required: true
        type: string

permissions: {}

jobs:
  request:
    if: github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    concurrency:
      group: request-review-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        with:
          script: |
            const raw = process.env.PR_NUMBER;
            if (!/^[1-9]\d*$/.test(raw) || !Number.isSafeInteger(Number(raw))) {
              throw new Error('PR number must be a positive integer');
            }
            const { owner, repo } = context.repo;
            const pull_number = Number(raw);
            const reviewer = 'yeaight7';
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number });
            if (pr.state !== 'open' || pr.draft || pr.user.login.toLowerCase() === reviewer ||
                pr.requested_reviewers.some(user => user.login.toLowerCase() === reviewer)) return;
            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner, repo, pull_number, per_page: 100
            });
            if (reviews.some(review => review.user?.login.toLowerCase() === reviewer &&
                ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED'].includes(review.state))) return;
            await github.rest.pulls.requestReviewers({ owner, repo, pull_number, reviewers: [reviewer] });
